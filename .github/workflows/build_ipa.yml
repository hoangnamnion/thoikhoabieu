name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package .IPA File
    runs-on: macos-14

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Scaffold iOS Runner
        run: |
          flutter create --platforms=ios --org com.thoikhoabieu .
          flutter pub get

      - name: Run Automated Tests
        run: |
          rm -f test/widget_test.dart
          flutter test

      - name: Build iOS App Bundle
        run: |
          flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -9 ThoiKhoaBieu.ipa Payload
          echo "Build IPA thanh cong!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThoiKhoaBieu-iOS-IPA
          path: build/ios/ipa/ThoiKhoaBieu.ipa
          retention-days: 14
